services:
  postgres:
    image: pgvector/pgvector:pg18
    container_name: matchmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-match_mind}
      POSTGRES_USER: ${POSTGRES_USER:-matchmind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - matchmind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-matchmind} -d ${POSTGRES_DB:-match_mind}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  matchmind_pgdata:

